<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Interest Cat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#c9a24b;--gold-bright:#f0c869;--velvet-1:#5a0f1c;--velvet-2:#2c060d;--ink:#150a0f;
--parchment:#f3e7d3;--parchment-dim:#d8c9ac;--tv-wood:#5a3420;--tv-screen:#0c1a14;--tv-glow:#6dffb0;
--neon:#ff6fae;color-scheme:dark;}
*{box-sizing:border-box;}html,body{height:100%;margin:0;}
body{background:radial-gradient(ellipse at 50% 15%,#2a1420 0%,var(--ink) 65%);

font-family:'Cormorant Garamond',serif;color:var(--parchment);overflow-x:hidden;min-height:100%;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
background-size:160% 160%;animation:bgshift 22s ease-in-out infinite;}
@keyframes bgshift{0%,100%{background-position:50% 0%;}50%{background-position:50% 100%;}}
@media (prefers-reduced-motion:reduce){body{animation:none;}}
h1,.display{font-family:'Cinzel',serif;letter-spacing:.03em;}

#curtain{position:fixed;inset:0;z-index:60;display:flex;}
.panel{flex:1;position:relative;height:100%;background:
  repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 14px,rgba(255,255,255,.03) 14px 26px),
  linear-gradient(180deg,var(--velvet-1),var(--velvet-2) 60%,#180307);
  box-shadow:inset 0 0 120px rgba(0,0,0,.65);transition:transform 1.1s cubic-bezier(.75,0,.2,1);}
.panel.left{transform-origin:left;border-right:2px solid rgba(0,0,0,.4);}
.panel.right{transform-origin:right;border-left:2px solid rgba(0,0,0,.4);}
#curtain.open .panel.left{transform:translateX(-102%) skewY(-1deg);}
#curtain.open .panel.right{transform:translateX(102%) skewY(1deg);}
#curtain-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;z-index:2;text-align:center;transition:opacity .5s ease;padding:0 24px;}
#curtain.open #curtain-mid{opacity:0;pointer-events:none;}
.curtain-title{font-size:clamp(28px,6vw,52px);color:var(--gold-bright);margin:0 0 6px;text-shadow:0 2px 18px rgba(0,0,0,.6);}
.curtain-sub{font-style:italic;color:var(--parchment-dim);margin:0 0 34px;font-size:clamp(15px,2.4vw,19px);}
#enter-btn{font-family:'Cinzel',serif;font-size:15px;letter-spacing:.12em;background:transparent;
  color:var(--gold-bright);border:1.5px solid var(--gold);padding:14px 34px;border-radius:2px;
  cursor:pointer;text-transform:uppercase;transition:background .25s,color .25s,box-shadow .25s;}
#enter-btn:hover{background:var(--gold);color:#1a0a0a;box-shadow:0 0 26px rgba(201,162,75,.55);}
.rope{width:2px;height:90px;background:linear-gradient(var(--gold),transparent);margin-bottom:18px;opacity:.6;}

#stage{max-width:760px;margin:0 auto;padding:56px 22px 220px;min-height:100vh;position:relative;z-index:1;}
#stage header{text-align:center;margin-bottom:8px;}
#stage .kicker{color:var(--gold);font-size:14px;letter-spacing:.15em;}
#stage h1{font-size:clamp(30px,5vw,44px);margin:6px 0 4px;color:var(--parchment);text-shadow:0 0 24px rgba(201,162,75,.25);}
#stage p.lede{color:var(--parchment-dim);font-size:19px;max-width:520px;margin:0 auto 40px;text-align:center;}
.console{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
  border:1px solid rgba(201,162,75,.3);border-radius:6px;padding:22px;box-shadow:0 0 40px rgba(201,162,75,.06);}
.row{display:flex;gap:10px;}
#question{flex:1;background:rgba(0,0,0,.25);border:1px solid rgba(201,162,75,.3);color:var(--parchment);
  font-family:'Cormorant Garamond',serif;font-size:18px;padding:13px 16px;border-radius:4px;outline:none;}
#question::placeholder{color:#8a7a68;}
#question:focus{border-color:var(--gold-bright);}
button.gilt{font-family:'Cinzel',serif;font-size:13px;letter-spacing:.08em;background:var(--gold);
  color:#1a0a0a;border:none;padding:0 20px;border-radius:4px;cursor:pointer;white-space:nowrap;
  transition:filter .2s,transform .2s;}
button.gilt:hover{filter:brightness(1.15);}
button.gilt:active{transform:scale(.97);}
button.gilt:disabled{opacity:.5;cursor:default;}
.divider{display:flex;align-items:center;gap:14px;margin:18px 0;color:#7a6a58;font-size:13px;letter-spacing:.1em;}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:rgba(201,162,75,.22);}
#interest-btn{width:100%;background:transparent;border:1px solid var(--gold);color:var(--gold-bright);
  font-family:'Cinzel',serif;letter-spacing:.1em;font-size:14px;padding:13px;border-radius:4px;
  cursor:pointer;transition:background .2s,box-shadow .2s;}
#interest-btn:hover{background:rgba(201,162,75,.14);box-shadow:0 0 22px rgba(201,162,75,.3);}
#interest-btn:disabled{opacity:.5;cursor:default;}
#wiki-btn{width:100%;margin-top:10px;background:rgba(255,255,255,.03);border:1px solid rgba(201,162,75,.45);color:var(--parchment-dim);
  font-family:'Cinzel',serif;letter-spacing:.08em;font-size:12px;padding:10px;border-radius:4px;cursor:pointer;transition:background .2s,color .2s;}
#wiki-btn:hover{background:rgba(201,162,75,.12);color:var(--gold-bright);}

#cat-wrap{position:fixed;right:32px;bottom:82px;z-index:30;display:flex;align-items:flex-end;}
#cat-img{width:104px;height:104px;object-fit:cover;border-radius:14px 14px 24px 24px;border:3px solid var(--gold);
  box-shadow:0 6px 24px rgba(0,0,0,.55);background:#1a0a0a;transform-origin:50% 90%;display:block;}
@keyframes tutorTalk{0%,100%{transform:translateY(0) rotate(0deg) scale(1);}25%{transform:translateY(-5px) rotate(-3deg) scale(1.02);}
  50%{transform:translateY(0) rotate(0deg) scale(1.05);}75%{transform:translateY(-3px) rotate(3deg) scale(1.02);}}
#cat-img.talking{animation:tutorTalk .5s ease-in-out infinite;}
@keyframes idle{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
#cat-img.idle{animation:idle 3.2s ease-in-out infinite;}
.ctrls{position:absolute;left:-38px;bottom:0;display:flex;flex-direction:column;gap:6px;}
.ctrl-btn{width:30px;height:30px;border-radius:50%;border:1px solid rgba(201,162,75,.5);
  background:rgba(18,10,13,.75);color:var(--gold-bright);font-size:13px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;line-height:1;}

#bubble{position:absolute;right:110px;bottom:70px;width:min(340px,62vw);background:var(--parchment);
  color:#241016;border-radius:14px;padding:14px 16px;font-size:16.5px;line-height:1.42;
  box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;transform:translateY(8px) scale(.97);
  transform-origin:bottom right;transition:opacity .22s ease,transform .22s ease;pointer-events:none;}
#bubble.show{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;}
#bubble::after{content:"";position:absolute;right:22px;bottom:-9px;width:0;height:0;
  border:10px solid transparent;border-top-color:var(--parchment);border-bottom:0;}
#bubble .tag{display:block;font-family:'Cinzel',serif;font-size:10.5px;letter-spacing:.1em;color:#8a6a2f;margin-bottom:5px;}
#bubble-text{display:block;max-height:30vh;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;}
#bubble .cursor{display:inline-block;width:7px;height:15px;background:#241016;margin-left:2px;vertical-align:-2px;animation:blink 1s step-end infinite;}
@keyframes blink{50%{opacity:0;}}
#visit-btn{display:none;margin-top:10px;width:100%;font-family:'Space Mono',monospace;font-size:12px;
  letter-spacing:.04em;background:#241016;color:var(--tv-glow);border:1px solid #241016;padding:8px;
  border-radius:4px;cursor:pointer;}
#visit-btn.show{display:block;}

@media (max-width:520px){#cat-wrap{right:18px;bottom:76px;}#cat-img{width:78px;height:78px;}#bubble{right:88px;bottom:56px;width:64vw;}.ctrls{left:-34px;}.ctrl-btn{width:26px;height:26px;}}

/* ---- retro TV overlay ---- */
#tv-overlay{position:fixed;inset:0;z-index:70;background:rgba(4,2,3,.88);display:none;
  align-items:center;justify-content:center;padding:20px;}
#tv-overlay.show{display:flex;}
#tv{width:min(480px,92vw);position:relative;}
#tv-antenna{position:absolute;top:-34px;left:50%;transform:translateX(-50%);width:120px;height:40px;z-index:1;}
#tv-antenna::before,#tv-antenna::after{content:"";position:absolute;bottom:0;width:2px;height:38px;background:var(--gold);}
#tv-antenna::before{left:34px;transform:rotate(-24deg);transform-origin:bottom;}
#tv-antenna::after{right:34px;transform:rotate(24deg);transform-origin:bottom;}
#tv-body{background:linear-gradient(160deg,#6b4128,var(--tv-wood) 60%,#3a1f10);border-radius:18px;
  padding:20px 20px 26px;box-shadow:0 24px 60px rgba(0,0,0,.6),inset 0 0 0 2px rgba(0,0,0,.3);}
#tv-screen{background:#000;border-radius:10px;padding:4px;box-shadow:inset 0 0 0 3px #1a1a1a;}
#tv-inner{position:relative;border-radius:7px;overflow:hidden;aspect-ratio:4/3;background:var(--tv-screen);}
#tv-static{position:absolute;inset:0;background:
  repeating-linear-gradient(0deg,#222 0 2px,#555 2px 3px,#111 3px 5px),
  repeating-linear-gradient(90deg,rgba(255,255,255,.02) 0 1px,transparent 1px 3px);
  opacity:0;animation:staticflick .12s steps(2) infinite;}
#tv-static.on{opacity:1;}
@keyframes staticflick{0%{filter:brightness(1);}50%{filter:brightness(1.6);}100%{filter:brightness(.9);}}
#tv-content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:18px;color:var(--tv-glow);font-family:'Space Mono',monospace;
  opacity:0;transition:opacity .3s ease;}
#tv-content.on{opacity:1;}
#tv-content::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,.15) 0 2px,transparent 2px 4px);}
#tv-channel{font-size:10px;letter-spacing:.12em;color:#7fd9a8;margin-bottom:10px;}
#tv-name{font-family:'Cinzel',serif;color:var(--tv-glow);font-size:19px;text-shadow:0 0 14px rgba(109,255,176,.4);margin:0 0 8px;}
#tv-desc{font-size:12.5px;line-height:1.6;color:#bfeed0;max-width:280px;}
#tv-controls{display:flex;justify-content:center;gap:10px;margin-top:16px;}
.tv-knob{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#c9a24b,#5a3d18);
  box-shadow:0 2px 4px rgba(0,0,0,.5);}
#tv-buttons{display:flex;gap:10px;margin-top:14px;}
#tv-buttons button{flex:1;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.05em;
  background:#1a1a1a;color:var(--gold-bright);border:1px solid #3a2a15;padding:9px;border-radius:5px;cursor:pointer;}
#tv-buttons button:hover{background:#241a0f;}

/* confetti */
.confetto{position:fixed;top:-14px;width:8px;height:14px;z-index:80;pointer-events:none;
  animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.4;}}

/* interest cat v2 */
#tv{width:min(900px,96vw)}#tv-inner{aspect-ratio:auto;height:min(64vh,600px)}
#tv-bar{display:flex;gap:10px;justify-content:space-between;font:11px 'Space Mono',monospace;color:#7fd9a8;margin:-4px 2px 8px;letter-spacing:.06em}
#tv-bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#tv-url{opacity:.7;text-align:right}
#tv-view{position:absolute;inset:0;overflow:hidden;background:#000}
#tv-frame{border:0;background:#fff;width:100%;height:100%;transform-origin:0 0}
#tv-static{pointer-events:none;z-index:2}
#tv-buttons{align-items:center;flex-wrap:wrap}#tv-buttons button{flex:0 1 auto;min-width:38px}#tv-again{margin-left:auto!important}
#zval{font:11px 'Space Mono',monospace;color:var(--gold-bright);min-width:44px;text-align:center}
#tv-hint{margin:8px 0 0;font-size:13px;color:#d8b98a;text-align:center;opacity:.8}
#radio{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;align-items:center;gap:6px;
 background:linear-gradient(180deg,#6b4128,#3a1f10);border:1px solid var(--gold);border-radius:12px;padding:6px 10px;box-shadow:0 6px 20px rgba(0,0,0,.5);max-width:calc(100vw - 150px)}
#radio button{width:28px;height:28px;border-radius:50%;border:1px solid rgba(201,162,75,.6);background:#150a0f;color:var(--gold-bright);cursor:pointer;font-size:11px}
#radio-name{font:11px 'Space Mono',monospace;color:var(--tv-glow);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px}
/* disco + rgb: transform-only animations, off unless radio plays */
.console{position:relative;overflow:hidden;isolation:isolate}
.console::before{content:"";display:none;position:absolute;inset:-60%;z-index:-2;background:conic-gradient(#f0f,#0ff,#ff0,#f0f);animation:spin 6s linear infinite}
.console::after{content:"";position:absolute;inset:2px;border-radius:5px;background:#1a0d12;z-index:-1}
body.party .console::before{display:block}
body.party .console{animation:neonpulse 2.6s ease-in-out infinite;}
@keyframes neonpulse{0%,100%{box-shadow:0 0 40px rgba(201,162,75,.06);}50%{box-shadow:0 0 30px var(--neon),0 0 60px rgba(255,111,174,.25);}}
@media (prefers-reduced-motion:reduce){body.party .console{animation:none;}}
#disco{position:fixed;inset:-25%;z-index:0;pointer-events:none;opacity:.15;will-change:transform;
 background:conic-gradient(#ff2d95,transparent 10%,#22ddff,transparent 22%,#99ff22,transparent 35%,#ff9900,transparent 47%,#aa33ff,transparent 60%,#22ddff,transparent 72%,#ff22aa,transparent 85%,#ff2d95);animation:spin 30s linear infinite}
#ball{position:fixed;top:0;left:50%;margin-left:-22px;width:44px;z-index:2;text-align:center;pointer-events:none;transform-origin:50% 0;animation:sway 4s ease-in-out infinite alternate}
#ball::before{content:"";display:block;width:1px;height:36px;background:#c9a24b88;margin:0 auto}#ball span{font-size:38px;display:block;line-height:1}
body:not(.party) #disco,body:not(.party) #ball{display:none}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes sway{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
body.hid *,body.hid *::before,body.hid *::after,body.tvopen #disco,body.tvopen #ball,body.tvopen .console::before{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){#disco,#ball,.console::before{animation:none!important}}
</style>
</head>
<body>

<div id="curtain">
  <div class="panel left"></div>
  <div id="curtain-mid">
    <div class="rope"></div>
    <div class="curtain-title">The Interest Cat</div>
    <p class="curtain-sub">Ask the curious cat for a fresh little rabbit hole.</p>
    <button id="enter-btn">Press to Enter</button>
  </div>
  <div class="panel right"></div>
</div>

<main id="stage">
  <header>
    <div class="kicker">A CURIOUS EXPERIMENT</div>
    <h1>The Interest Cat</h1>
    <p class="lede">Name a curiosity, or let the cat pick a fresh, real corner of the public web.</p>
  </header>
  <div class="console">
    <div class="row">
      <input id="question" type="text" placeholder="Any topic? (optional) space, maps, weird art…" autocomplete="off">
      <button id="ask-btn" class="gilt">Find</button>
    </div>
    <div class="divider">OR</div>
    <button id="interest-btn">✦ Interest Me ✦</button>
    <button id="wiki-btn">◎ Wikipedia Roulette</button>
  </div>
</main>

<div id="cat-wrap">
  <div class="ctrls">
    <button id="mute-btn" class="ctrl-btn" title="Toggle voice">🔊</button>
    <button id="disco-btn" class="ctrl-btn" title="Disco + RGB">🩩</button>
  </div>
  <div id="bubble">
    <span class="tag">The Interest Cat says</span>
    <span id="bubble-text"></span>
    <button id="visit-btn">▸ beam me there</button>

<script>
(function(){
  // ---------- voice ----------
  let voiceOn = true;
  try{ voiceOn = localStorage.getItem('oracle-voice') !== 'off'; }catch(e){}
  const muteBtn = document.getElementById('mute-btn');
  function paintMute(){ muteBtn.textContent = voiceOn ? '🔊' : '🔇'; }
  paintMute();
  muteBtn.addEventListener('click', () => {
    voiceOn = !voiceOn; paintMute();
    if(!voiceOn) speechSynthesis.cancel();
    try{ localStorage.setItem('oracle-voice', voiceOn?'on':'off'); }catch(e){}
  });
  let pickedVoice = null;
  function loadVoice(){
    const vs = speechSynthesis.getVoices();
    const prefs = ['Google UK English Female','Samantha','Google US English','Karen','Zira','Victoria'];
    pickedVoice = vs.find(v => prefs.includes(v.name)) || vs.find(v => /female|karen|zira|samantha/i.test(v.name)) || vs[0] || null;
  }
  speechSynthesis.onvoiceschanged = loadVoice; loadVoice();
  function say(text){
    if(!voiceOn || !('speechSynthesis' in window) || !text) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    if(pickedVoice) u.voice = pickedVoice;
    u.pitch = 1.55; u.rate = 1.12; u.volume = 0.9;
    speechSynthesis.speak(u);
  }

  // ---------- jazz music (procedural, Web Audio) ----------
  let actx=null, musicOn=false, musicTimer=null;
    const chords = [[261.6,329.6,392.0,466.2,523.2],[233.1,293.7,349.2,415.3,466.2],[220.0,277.2,329.6,392.0,440.0],[246.9,311.1,370.0,440.0,493.9]];
  function playNote(freq,t,dur,type,vol){
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type; o.frequency.value=freq;
    vol*=0.22;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+dur+0.05);
  }
  let chordIdx=0, beat=0;
  function scheduleBar(){
    if(!musicOn) return;
    const t0=actx.currentTime+0.05; const chord=chords[chordIdx%chords.length];
    chord.forEach((f,i)=>playNote(f/2,t0+i*0.035,2.2,'triangle',0.025));
    const bassNote=chord[0]/4;
    playNote(bassNote,t0,0.8,'sine',0.04);
    playNote(bassNote*1.5,t0+0.85,0.5,'sine',0.035);
    playNote(chord[2]/2,t0+1.35,0.45,'sine',0.03);
    [0,0.42,0.9,1.3].forEach(off=>{const g=actx.createGain(),n=actx.createOscillator();
      n.type='triangle';n.frequency.value=4200+Math.random()*300;
      g.gain.setValueAtTime(0.006,t0+off); g.gain.exponentialRampToValueAtTime(0.001,t0+off+0.07);
      n.connect(g);g.connect(actx.destination);n.start(t0+off);n.stop(t0+off+0.06);});
    chordIdx++;
    musicTimer=setTimeout(scheduleBar,1900);
  }
  function paintMusic(){ radioPaint(); }
  function startMusic(){
    try{
      if(!actx){ const AudioContext=window.AudioContext||window.webkitAudioContext; if(!AudioContext) return false; actx = new AudioContext(); }
      if(actx.state==='suspended') actx.resume();
      musicOn = true; paintMusic(); scheduleBar(); return true;
    }catch(e){ musicOn=false; paintMusic(); return false; }
  }
  function stopMusic(){ musicOn=false; clearTimeout(musicTimer); paintMusic(); }

  // ---------- confetti ----------
  function confetti(n){
    const colors=['#c9a24b','#f0c869','#ff6fae','#6dffb0','#f3e7d3'];
    for(let i=0;i<(n||60);i++){
      const el=document.createElement('div'); el.className='confetto';
      el.style.left=Math.random()*100+'vw';
      el.style.background=colors[Math.floor(Math.random()*colors.length)];
      el.style.animationDuration=(2+Math.random()*1.5)+'s';
      el.style.borderRadius=Math.random()>0.5?'50%':'2px';
      document.body.appendChild(el);
      setTimeout(()=>el.remove(),3800);
    }
  }

  // ---------- curtain ----------
  const curtain = document.getElementById('curtain');
  document.getElementById('enter-btn').addEventListener('click', () => {
    const greeting="Mrrp! Ask me anything and I will find you something curious.";
    curtain.classList.add('open');
    radioPlay();
    say(greeting);
    confetti(50);
    setTimeout(() => {
      curtain.remove();
      speak(greeting, false);
      stopTalking();
    }, 1250);
  });

  // ---------- cat speaking / bubble ----------
  const catImg = document.getElementById('cat-img');
  const bubble = document.getElementById('bubble');
  const bubbleText = document.getElementById('bubble-text');
  const visitBtn = document.getElementById('visit-btn');
  let hideTimer=null;

  function speak(text, streaming){
    clearTimeout(hideTimer);
    bubble.classList.add('show');
    catImg.classList.remove('idle'); catImg.classList.add('talking');
    bubbleText.textContent = text;
    if(streaming){ const c=document.createElement('span'); c.className='cursor'; bubbleText.appendChild(c); }
    bubbleText.scrollTop = bubbleText.scrollHeight;
  }
  function stopTalking(){
    catImg.classList.remove('talking'); catImg.classList.add('idle');
    hideTimer=setTimeout(()=>bubble.classList.remove('show'),7000);
  }

  
  // ---------- radio ----------
  const $=id=>document.getElementById(id);
  const STATIONS=[
    {n:'Original Chill Jazz (built-in)',u:null},
    {n:'Chill Jazz (YouTube)',yt:'https://www.youtube.com/embed/zR6D5o5bIdU?autoplay=1&loop=1&playlist=zR6D5o5bIdU'},
    {n:'SomaFM Groove Salad',u:'https://ice1.somafm.com/groovesalad-128-mp3'},
    {n:'SomaFM Beat Blender',u:'https://ice1.somafm.com/beatblender-128-mp3'},
    {n:'SomaFM Underground 80s',u:'https://ice1.somafm.com/u80s-128-mp3'},
    {n:'SomaFM Illinois St Lounge',u:'https://ice1.somafm.com/illstreet-128-mp3'}];
  let st=1, radioOn=false, ytFrame=null, discoOn=!matchMedia('(prefers-reduced-motion: reduce)').matches, playToken=0;
  const au=new Audio(); au.preload='none'; au.volume=.12;
  function radioPaint(){
    const on=radioOn||musicOn; $('radio-btn').textContent=on?'\u23f8':'\u25b6'; $('radio-name').textContent='📻 '+STATIONS[st].n;
    $('disco-btn').style.opacity=discoOn?1:.45; document.body.classList.toggle('party',on&&discoOn);
  }
  function hardStop(){ au.onerror=null; au.pause(); au.removeAttribute('src'); au.load(); if(ytFrame){ ytFrame.remove(); ytFrame=null; } stopMusic(); radioOn=false; }
  function radioStop(){ playToken++; hardStop(); radioPaint(); }
  function radioPlay(){
    const myToken=++playToken;
    hardStop();
    const s=STATIONS[st];
    if(s.yt){
      ytFrame=document.createElement('iframe'); ytFrame.src=s.yt; ytFrame.title=s.n; ytFrame.allow='autoplay';
      ytFrame.style.cssText='position:fixed;left:-10000px;top:-10000px;width:2px;height:2px;border:0;opacity:0;';
      document.body.appendChild(ytFrame); radioOn=true; radioPaint(); return;
    }
    if(!s.u){ startMusic(); return; }
    radioPaint();
    au.onerror=()=>{ if(myToken===playToken) skipBroken(); };
    au.src=s.u; au.load();
    au.play().then(()=>{ if(myToken===playToken){ radioOn=true; radioPaint(); } })
             .catch(()=>{ if(myToken===playToken) skipBroken(); });
  }
  function skipBroken(){
    st=0;
    startMusic();
    radioPaint();
  }
  $('radio-btn').onclick=()=>(radioOn||musicOn)?radioStop():radioPlay();
  $('disco-btn').onclick=()=>{ discoOn=!discoOn; radioPaint(); };
  document.addEventListener('visibilitychange',()=>document.body.classList.toggle('hid',document.hidden));
  radioPaint();

  // ---------- the whole web: sites + blacklist ----------
  const BLOCK=/useless\s*-?web|neal\.fun|\b(sign[\s-]?up|log[\s-]?in|register|registration|subscribe|subscription|paywall|membership|account|porn|xxx|nsfw|hentai|onlyfans|escort|hookup|cam-?girl|gambl\w*|casino|sports-?bet\w*|poker|drugs?|narcotic|weapon|firearm|gore|torture|self-?harm|suicide|hate|nazi|extremis\w*|torrent|piracy|warez|crack(ed)?-?software)\b/i;
  let seen=[], seenHosts=[];
  let wikiSeen=[];
  try{
    seen=JSON.parse(localStorage.getItem('interest-cat-seen')||'[]').filter(url=>typeof url==='string');
    seenHosts=JSON.parse(localStorage.getItem('interest-cat-hosts')||'[]').filter(host=>typeof host==='string');
    wikiSeen=JSON.parse(localStorage.getItem('interest-cat-wiki-seen')||'[]').filter(url=>typeof url==='string');
  }catch(e){ seen=[]; seenHosts=[]; wikiSeen=[]; }
  const saveSeen=()=>{ try{ localStorage.setItem('interest-cat-seen',JSON.stringify(seen)); localStorage.setItem('interest-cat-hosts',JSON.stringify(seenHosts)); localStorage.setItem('interest-cat-wiki-seen',JSON.stringify(wikiSeen)); }catch(e){} };
  const randomToken=()=>{ try{ return Array.from(crypto.getRandomValues(new Uint32Array(3))).join('-'); }catch(e){ return Math.random().toString(36).slice(2)+Date.now(); } };
  const withTimeout=(promise,ms)=>Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(new Error('Timed out')),ms))]);
  let sample=null, cur=null, busy=false;
  (async()=>{ try{ sample = window.claude ? await window.claude.use('sample') : null; }catch(e){ sample=null; } })();
  const canonicalUrl=u=>{ try{ const x=new URL(u); return x.href.replace(/\/$/,''); }catch(e){ return null; } };
  const hostKey=u=>{ try{ return new URL(u).hostname.toLowerCase().replace(/^www\./,''); }catch(e){ return null; } };
  seen=seen.map(canonicalUrl).filter(Boolean);
  seenHosts=[...new Set(seenHosts.concat(seen.map(hostKey)).filter(Boolean))];
  const okUrl=u=>{ const url=canonicalUrl(u), host=hostKey(url); return !!url&&!!host&&!BLOCK.test(url)&&!seen.includes(url)&&!seenHosts.includes(host); };
  async function probeAlive(url){
    try{
      const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(),2500);
      await fetch(url,{mode:'no-cors',signal:ctrl.signal});
      clearTimeout(t); return true;
    }catch(e){ return false; }
  }
  async function findSite(topic){
    if(sample){ try{
      const r=await withTimeout(sample([{role:'user',content:'Selection machine token '+randomToken()+'. You are the Interest Cat. You may choose ANY real, currently-live website on the public web; do not limit yourself to the built-in examples, a shortlist, or specific named sites. Go wide: obscure blogs, indie tools, archives, generators, museums, oddities, forgotten corners, and useful surprises. Pick ONE genuinely fascinating website'+(topic?' related to: '+topic:'')+'. It must actually exist and load right now \u2014 never invent or guess a domain, and never suggest a site you are not confident is real. It must be safe-for-work and appropriate for all ages: absolutely no adult, violent, gambling, illegal, hateful, sign-up, login, registration, subscription, membership, account, or paywall-required content. Prefer creative, educational or wonderfully weird independent sites that work inside an iframe. Never suggest theuselessweb.com or neal.fun, nor any of these already shown: '+(seenHosts.slice(-12).join(', ')||'none')+'. Reply with ONLY raw JSON, no markdown fences: {"name":"","url":"https://...","desc":"one playful sentence explaining why this is interesting"}'}],{modelTier:'quick'}),5000);
      const j=JSON.parse(r.text.match(/\{[\s\S]*\}/)[0]);
      if(okUrl(j.url)&&!BLOCK.test(j.name)&&!BLOCK.test(j.desc)&&await probeAlive(j.url)) return {name:String(j.name).slice(0,60),url:canonicalUrl(j.url),desc:String(j.desc).slice(0,200),ch:String(10+Math.floor(Math.random()*80))};
    }catch(e){} }
    return null;
  }

  // ---------- retro TV virtual site machine ----------
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  const tv=$('tv-overlay'), frame=$('tv-frame'), stat=$('tv-static'); let zoom=1;
  function setZoom(z){ zoom=Math.min(3,Math.max(.4,Math.round(z*10)/10)); frame.style.width=(100/zoom)+'%'; frame.style.height=(100/zoom)+'%'; frame.style.transform='scale('+zoom+')'; $('zval').textContent=Math.round(zoom*100)+'%'; }
  $('zin').onclick=()=>setZoom(zoom+.2); $('zout').onclick=()=>setZoom(zoom-.2); $('zreset').onclick=()=>setZoom(1);
  async function tuneIn(){
    if(busy) return; busy=true; const topic=$('question').value.trim();
    try{
      tv.classList.add('show'); document.body.classList.add('tvopen'); stat.classList.add('on'); frame.src='about:blank';
      $('tv-channel').textContent='SCANNING THE WEB\u2026'; $('tv-url').textContent=''; speak('Consulting the public web\u2026',true);
      const [site]=await Promise.all([findSite(topic),wait(350)]);
      if(!site) throw new Error('No fresh destination available');
      const pickedUrl=canonicalUrl(site.url), pickedHost=hostKey(pickedUrl);
      if(pickedUrl&&!seen.includes(pickedUrl)) seen.push(pickedUrl);
      if(pickedHost&&!seenHosts.includes(pickedHost)) seenHosts.push(pickedHost);
      saveSeen(); cur=site; setZoom(1);
      frame.onload=()=>stat.classList.remove('on');
      setTimeout(()=>stat.classList.remove('on'),1800);
      frame.src=site.url;
      $('tv-channel').textContent='CH '+site.ch+' \u00b7 '+site.name; $('tv-url').textContent=site.url.replace(/^https:\/\//,'');
      const explanation=site.desc||'A curious little corner of the web has appeared. See what catches your eye.';
      speak(explanation,false); say(explanation); stopTalking(); confetti(40);
    }catch(e){
      stat.classList.remove('on');
      speak('That lesson got shy. Try the next site button for another one.',false);
    }finally{ busy=false; }
  }
  async function wikiRoulette(){
    if(busy) return; busy=true;
    try{
      tv.classList.add('show'); document.body.classList.add('tvopen'); stat.classList.add('on'); frame.src='about:blank';
      $('tv-channel').textContent='WIKIPEDIA ROULETTE'; $('tv-url').textContent=''; speak('Spinning the encyclopedia…',true);
      let page=null;
      for(let attempt=0;attempt<5&&!page;attempt++){
        const response=await fetch('https://en.wikipedia.org/api/rest_v1/page/random/summary',{cache:'no-store'});
        if(!response.ok) continue;
        const candidate=await response.json();
        const url=canonicalUrl(candidate?.content_urls?.desktop?.page);
        if(url&&!wikiSeen.includes(url)) page={...candidate,url};
      }
      if(!page) throw new Error('No fresh Wikipedia page');
      wikiSeen.push(page.url); saveSeen(); cur={url:page.url}; setZoom(1);
      frame.onload=()=>stat.classList.remove('on'); setTimeout(()=>stat.classList.remove('on'),1800);
      frame.src=page.url; $('tv-channel').textContent='WIKI · '+String(page.title||'RANDOM PAGE').slice(0,52); $('tv-url').textContent=page.url.replace(/^https:\/\//,'');
      const explanation=String(page.extract||'A fresh Wikipedia rabbit hole has appeared.').slice(0,220);
      speak(explanation,false); say(explanation); stopTalking(); confetti(20);
    }catch(e){ stat.classList.remove('on'); speak('The roulette wheel jammed. Try another spin.',false); }
    finally{ busy=false; }
  }
  ['interest-btn','ask-btn'].forEach(id=>$(id).addEventListener('click',tuneIn));
  $('wiki-btn').addEventListener('click',wikiRoulette);
  $('question').addEventListener('keydown',e=>{ if(e.key==='Enter') tuneIn(); });
  $('tv-again').onclick=()=>{ $('question').value=''; tuneIn(); };
  $('tv-open').onclick=()=>{ if(cur) window.open(cur.url,'_blank','noopener'); };
  const closeTv=()=>{ tv.classList.remove('show'); document.body.classList.remove('tvopen'); frame.src='about:blank'; speechSynthesis.cancel(); };
  $('tv-close').onclick=closeTv; tv.addEventListener('click',e=>{ if(e.target===tv) closeTv(); });
})();
</script>
</body>
